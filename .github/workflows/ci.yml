name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    # gitleaks-action scans from the first pushed commit's parent, which fails on a repo's
    # first push (the root commit has none). That push is scanned locally before publishing.
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  harness:
    name: Harness (lint, types, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full-version tags (no moving v10), so pin the latest release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra claude
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src tests
      # The runner, validator, CLI, and tracing are unit-tested with scoring faked; keep it so.
      - run: uv run pytest --cov=agent_eval_gate --cov-fail-under=80

  benchmark:
    name: Benchmark validity (references pass, every bug caught)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: uv sync
      # Each frozen split must be the seeded draw its tasks.yaml documents.
      - run: |
          uv run aeg split --benchmark benchmarks/vendor-intake/v1 --seed 20261027 --sampled heldout
          uv run aeg split --benchmark benchmarks/vendor-intake/v2 --seed 20261027 --sampled heldout
          uv run aeg split --benchmark benchmarks/vendor-intake-ui/v1 --seed 20261101 --sampled dev
      - run: uv run aeg -v validate --benchmark benchmarks/vendor-intake/v1
      - run: uv run aeg -v validate --benchmark benchmarks/vendor-intake/v2
      # v3's held-out tasks are scenarios written after v2 froze, not a seeded draw: no split check.
      - run: uv run aeg -v validate --benchmark benchmarks/vendor-intake/v3
      - run: uv run aeg -v validate --benchmark benchmarks/vendor-intake-ui/v1

  gate:
    name: Gate (reference agent holds its baseline)
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          agent: reference
          replay: "false"
          baseline: baselines/reference-dev.json
