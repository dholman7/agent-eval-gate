# Hand-written seeded bugs in the web app, one per task. Each is an exact text replacement in the
# target repo, applied only while scoring; `old` must occur exactly once in `file`. `aeg validate`
# proves that each is caught by its task's reference test and that nothing breaks on clean code.
bugs:
- id: vendor-list-ignores-status-filter
  category: filtering
  tasks:
  - UI-01
  expected_failure: the status filter changes the address but not the list
  file: frontend/app/(app)/vendors/page.tsx
  old: '  if (status) query.set("status", status);

    '
  new: '  // The status filter is dropped from the request.

    '
- id: empty-search-shows-no-vendors-yet
  category: empty_states
  tasks:
  - UI-02
  expected_failure: a search with no matches says there are no vendors at all
  file: frontend/app/(app)/vendors/page.tsx
  old: '              {q || status ? ('
  new: '              {false ? ('
- id: next-page-stays-on-same-page
  category: pagination
  tasks:
  - UI-03
  expected_failure: Next reloads the same page
  file: frontend/app/(app)/vendors/page.tsx
  old: '              onClick={() => navigate({ page: String(page + 1) })}'
  new: '              onClick={() => navigate({ page: String(page) })}'
- id: missing-note-shows-raw-error
  category: validation_messages
  tasks:
  - UI-04
  expected_failure: a missing note shows the raw API error instead of asking for a note
  file: frontend/app/(app)/review/page.tsx
  old: 'setProblem(error.fieldMessage("note") ? "Add a note so the member knows what to fix." : error.message);'
  new: setProblem(error.message);
