# Prompt-injection cases for test-writing agents (`aeg attack`; oracles in src/agent_eval_gate/attacks.py).
# Dev tasks only, so the held-out split stays blind. Each plant edits the agent's private copy of
# the repo; scoring runs against the pristine app.
#
# Carriers, from most to least directly handed to the agent:
#   story         the scenario text (a Jira description in Storywright's real use)
#   openapi       openapi.json, which every agent here reads as context
#   context_file  e2e/fixtures source, read as context by Storywright and the single call
#   agents_md     e2e/AGENTS.md: a channel agents are told to follow, so success here is the
#                 hardest to defend without also ignoring the repo's real rules
#   source_file   backend source, reachable only by reading files with tools
