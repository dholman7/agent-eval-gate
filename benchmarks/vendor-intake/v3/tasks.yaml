# Dev: v2's 12 dev tasks, unchanged; prompts may be tuned on them.
# Held-out: features/lifecycle.feature, in order. Not a random draw: every task in it is held out,
# frozen at the target ref before any agent saw it, and run only for reported numbers.
tasks:
  - {id: AUTH-06, split: dev, feature: features/auth.feature, scenario: "Signing out clears the session cookie"}
  - {id: VEN-03, split: dev, feature: features/vendors.feature, scenario: "Vendor names are unique within a tenant"}
  - {id: VEN-05, split: dev, feature: features/vendors.feature, scenario: "List vendors with search, status filter, and pagination"}
  - {id: VEN-07, split: dev, feature: features/vendors.feature, scenario: "Vendors from another tenant are invisible"}
  - {id: VEN-09, split: dev, feature: features/vendors.feature, scenario: "A vendor under review cannot be edited"}
  - {id: DOC-02, split: dev, feature: features/documents.feature, scenario: "Extraction completes in the background"}
  - {id: DOC-03, split: dev, feature: features/documents.feature, scenario: "Fields that cannot be parsed get low confidence"}
  - {id: DOC-06, split: dev, feature: features/documents.feature, scenario: "Documents cannot be added to a vendor under review"}
  - {id: REV-01, split: dev, feature: features/review.feature, scenario: "Submit a vendor with all documents extracted"}
  - {id: REV-05, split: dev, feature: features/review.feature, scenario: "Approving every extraction approves the vendor"}
  - {id: REV-07, split: dev, feature: features/review.feature, scenario: "An expired insurance certificate cannot be approved"}
  - {id: AUD-02, split: dev, feature: features/audit.feature, scenario: "Audit trails from another tenant are invisible"}
  - {id: LIF-01, split: heldout, feature: features/lifecycle.feature, scenario: "A re-uploaded document is the one that gets reviewed"}
  - {id: LIF-02, split: heldout, feature: features/lifecycle.feature, scenario: "Rejecting one document sends the whole vendor back"}
  - {id: LIF-03, split: heldout, feature: features/lifecycle.feature, scenario: "Once a vendor is sent back, its other documents cannot be decided"}
  - {id: LIF-04, split: heldout, feature: features/lifecycle.feature, scenario: "Resubmitting without replacing the rejected document is refused"}
  - {id: LIF-05, split: heldout, feature: features/lifecycle.feature, scenario: "After a replacement, only the new document waits for review"}
  - {id: LIF-06, split: heldout, feature: features/lifecycle.feature, scenario: "Approving the replacement approves a vendor whose other documents were already approved"}
  - {id: LIF-07, split: heldout, feature: features/lifecycle.feature, scenario: "A certificate that expires today can still be approved"}
  - {id: LIF-08, split: heldout, feature: features/lifecycle.feature, scenario: "A certificate whose expiry date could not be read cannot be approved"}
  - {id: LIF-09, split: heldout, feature: features/lifecycle.feature, scenario: "A vendor that was sent back can be edited again"}
  - {id: LIF-10, split: heldout, feature: features/lifecycle.feature, scenario: "A vendor cannot be renamed to another vendor's name, whatever the case"}
  - {id: LIF-11, split: heldout, feature: features/lifecycle.feature, scenario: "Sign-in ignores the case of the email address"}
  - {id: LIF-12, split: heldout, feature: features/lifecycle.feature, scenario: "An admin can review vendors"}
  - {id: LIF-13, split: heldout, feature: features/lifecycle.feature, scenario: "Search ignores case and matches part of a name"}
  - {id: LIF-14, split: heldout, feature: features/lifecycle.feature, scenario: "Search and the status filter apply together"}
  - {id: LIF-15, split: heldout, feature: features/lifecycle.feature, scenario: "A page past the last vendor is empty but still reports the total"}
